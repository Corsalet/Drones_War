<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Tactical Air Defense Simulator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; font-family: 'Arial', sans-serif; background: #000; }
#gameCanvas { display: block; }

/* Главное меню */
#mainMenu {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 1000;
}
#mainMenu h1 {
    color: #00ff88; font-size: 48px; margin-bottom: 40px;
    text-shadow: 0 0 20px #00ff88;
}
.menuBtn {
    background: rgba(0, 255, 136, 0.1); border: 2px solid #00ff88;
    color: #00ff88; padding: 15px 40px; margin: 10px; font-size: 18px;
    cursor: pointer; transition: all 0.3s; min-width: 300px;
}
.menuBtn:hover {
    background: rgba(0, 255, 136, 0.3); transform: scale(1.05);
    box-shadow: 0 0 20px #00ff88;
}

/* Магазин */
#shopMenu {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(20, 20, 40, 0.95); border: 2px solid #00ff88;
    padding: 30px; display: none; z-index: 1001; min-width: 500px;
}
#shopMenu h2 { color: #00ff88; margin-bottom: 20px; text-align: center; }
.shopItem {
    background: rgba(0, 255, 136, 0.1); border: 1px solid #00ff88;
    padding: 15px; margin: 10px 0; display: flex; justify-content: space-between;
    align-items: center;
}
.shopItem button {
    background: #00ff88; color: #000; border: none; padding: 8px 20px;
    cursor: pointer; font-weight: bold;
}
.shopItem button:disabled { background: #666; cursor: not-allowed; }

/* HUD */
#hud {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; display: none; z-index: 100;
}
#credits {
    position: absolute; top: 20px; right: 20px;
    color: #00ff88; font-size: 24px; font-weight: bold;
    text-shadow: 0 0 10px #00ff88;
}
#timer {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 28px; font-weight: bold;
    text-shadow: 0 0 10px #000;
}
#baseHP {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    width: 300px; height: 20px; background: rgba(0,0,0,0.5);
    border: 2px solid #fff;
}
#baseHPBar {
    height: 100%; background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00);
    width: 100%; transition: width 0.3s;
}
#minimap {
    position: absolute; bottom: 20px; right: 20px;
    width: 200px; height: 200px; background: rgba(0,0,0,0.7);
    border: 2px solid #00ff88;
}
#minimapCanvas { width: 100%; height: 100%; }

/* Прицел ПВО */
#aaCrosshair {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 100px; height: 100px; display: none;
}
#aaCrosshair::before, #aaCrosshair::after {
    content: ''; position: absolute; background: #00ff88;
}
#aaCrosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
#aaCrosshair::after { width: 100%; height: 2px; top: 50%; transform: translateY(-50%); }
#heatBar {
    position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 20px; background: rgba(0,0,0,0.5);
    border: 2px solid #fff; display: none;
}
#heatBarFill {
    height: 100%; background: linear-gradient(90deg, #00ff00, #ffff00, #ff0000);
    width: 0%; transition: width 0.1s;
}
#ammoCount {
    position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 20px; display: none;
}

/* HUD FPV */
#fpvHUD {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: none;
}
#artificialHorizon {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 300px; height: 300px; border: 2px solid rgba(0,255,136,0.5);
    border-radius: 50%; overflow: hidden;
}
#horizonInner {
    width: 100%; height: 200%; background: linear-gradient(180deg, #87ceeb 0%, #87ceeb 50%, #8b4513 50%, #8b4513 100%);
    transition: transform 0.1s;
}
#speedIndicator {
    position: absolute; left: 50px; top: 50%; transform: translateY(-50%);
    color: #00ff88; font-size: 24px; font-weight: bold;
}
#altitudeIndicator {
    position: absolute; right: 50px; top: 50%; transform: translateY(-50%);
    color: #00ff88; font-size: 24px; font-weight: bold;
}
#recIndicator {
    position: absolute; top: 30px; left: 30px;
    color: #ff0000; font-size: 20px; font-weight: bold;
    animation: blink 1s infinite;
}
@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
#fpvCrosshair {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 80px; height: 80px; border: 2px solid #00ff88; border-radius: 50%;
}
#fpvCrosshair::before, #fpvCrosshair::after {
    content: ''; position: absolute; background: #00ff88;
}
#fpvCrosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
#fpvCrosshair::after { width: 100%; height: 2px; top: 50%; transform: translateY(-50%); }

#lives {
    position: absolute; top: 20px; left: 20px;
    color: #ff0000; font-size: 24px; font-weight: bold;
}
#gameOver {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9); border: 3px solid #ff0000;
    padding: 40px; display: none; z-index: 1002; text-align: center;
}
#gameOver h2 { color: #ff0000; font-size: 48px; margin-bottom: 20px; }
#gameOver p { color: #fff; font-size: 24px; margin: 10px 0; }
#gameOver button {
    background: #00ff88; color: #000; border: none; padding: 15px 40px;
    font-size: 20px; cursor: pointer; margin-top: 20px;
}
</style>
</head>
<body>

<!-- Главное меню -->
<div id="mainMenu">
    <h1>ТАКТИЧЕСКИЙ СИМУЛЯТОР ПВО</h1>
    <button class="menuBtn" onclick="startGame('training_aa')">Обучение ПВО</button>
    <button class="menuBtn" onclick="startGame('training_drone')">Обучение Дрон</button>
    <button class="menuBtn" onclick="startGame('battle')">Масштабная битва</button>
    <button class="menuBtn" onclick="toggleShop()">Магазин</button>
</div>

<!-- Магазин -->
<div id="shopMenu">
    <h2>МАГАЗИН</h2>
    <div class="shopItem">
        <span>Улучшенные пушки ПВО (+50% урона)</span>
        <button onclick="buyUpgrade('aa_gun', 500)">500 кредитов</button>
    </div>
    <div class="shopItem">
        <span>Ракетное ПВО (самонаведение)</span>
        <button onclick="buyUpgrade('aa_missile', 1000)">1000 кредитов</button>
    </div>
    <div class="shopItem">
        <span>Разведчик (быстрый дрон)</span>
        <button onclick="buyUpgrade('drone_scout', 300)">300 кредитов</button>
    </div>
    <div class="shopItem">
        <span>Ударный дрон (Bayraktar)</span>
        <button onclick="buyUpgrade('drone_strike', 800)">800 кредитов</button>
    </div>
    <div class="shopItem">
        <span>FPV-камикадзе</span>
        <button onclick="buyUpgrade('drone_fpv', 400)">400 кредитов</button>
    </div>
    <button class="menuBtn" onclick="toggleShop()" style="margin-top: 20px;">Закрыть</button>
</div>

<!-- HUD -->
<div id="hud">
    <div id="credits">Кредиты: <span id="creditsValue">0</span></div>
    <div id="timer">10:00</div>
    <div id="baseHP"><div id="baseHPBar"></div></div>
    <div id="minimap"><canvas id="minimapCanvas" width="200" height="200"></canvas></div>
    
    <!-- Прицел ПВО -->
    <div id="aaCrosshair"></div>
    <div id="heatBar"><div id="heatBarFill"></div></div>
    <div id="ammoCount">Патроны: <span id="ammoValue">100</span></div>
    
    <!-- HUD FPV -->
    <div id="fpvHUD">
        <div id="artificialHorizon"><div id="horizonInner"></div></div>
        <div id="speedIndicator">0 км/ч</div>
        <div id="altitudeIndicator">0 м</div>
        <div id="recIndicator">● REC</div>
        <div id="fpvCrosshair"></div>
    </div>
    
    <div id="lives">Жизни: <span id="livesValue">3</span></div>
</div>

<!-- Game Over -->
<div id="gameOver">
    <h2>ИГРА ОКОНЧЕНА</h2>
    <p id="gameOverText"></p>
    <button onclick="location.reload()">В главное меню</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// Глобальные переменные
let scene, camera, renderer, clock;
let player, playerType = 'aa';
let enemies = [], allies = [], projectiles = [], explosions = [];
let keys = {}, mouse = { x: 0, y: 0, locked: false };
let gameState = 'menu'; // menu, playing, paused, gameover
let gameMode = '';
let credits = 0, lives = 3, gameTime = 600; // 10 минут
let baseBlue, baseRed;
let terrain, trees = [];
let cameraShake = 0;
let upgrades = { aa_gun: false, aa_missile: false, drone_scout: false, drone_strike: false, drone_fpv: false };

// Инициализация Three.js
function initThree() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 100, 5000);
    
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
    camera.position.set(0, 50, 100);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    
    // Освещение
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    
    const sunLight = new THREE.DirectionalLight(0xffffff, 1);
    sunLight.position.set(500, 1000, 500);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 5000;
    sunLight.shadow.camera.left = -1000;
    sunLight.shadow.camera.right = 1000;
    sunLight.shadow.camera.top = 1000;
    sunLight.shadow.camera.bottom = -1000;
    scene.add(sunLight);
    
    clock = new THREE.Clock();
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}

// Процедурный ландшафт
function createTerrain() {
    const size = 10000;
    const segments = 100;
    const geometry = new THREE.PlaneGeometry(size, size, segments, segments);
    
    // Создаем холмы с помощью синусов
    const vertices = geometry.attributes.position.array;
    for (let i = 0; i < vertices.length; i += 3) {
        const x = vertices[i];
        const y = vertices[i + 1];
        vertices[i + 2] = Math.sin(x * 0.01) * 20 + Math.cos(y * 0.01) * 20 + 
                          Math.sin(x * 0.005 + y * 0.005) * 40;
    }
    geometry.computeVertexNormals();
    
    // Процедурная текстура
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    
    // Рисуем траву/грязь/камни
    for (let i = 0; i < 10000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const color = Math.random();
        if (color < 0.6) ctx.fillStyle = '#2d5016'; // трава
        else if (color < 0.85) ctx.fillStyle = '#4a3728'; // грязь
        else ctx.fillStyle = '#6b6b6b'; // камни
        ctx.fillRect(x, y, 2 + Math.random() * 3, 2 + Math.random() * 3);
    }
    
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(50, 50);
    
    const material = new THREE.MeshLambertMaterial({ map: texture });
    terrain = new THREE.Mesh(geometry, material);
    terrain.rotation.x = -Math.PI / 2;
    terrain.receiveShadow = true;
    scene.add(terrain);
}

// Создание деревьев
function createTrees() {
    for (let i = 0; i < 200; i++) {
        const x = (Math.random() - 0.5) * 8000;
        const z = (Math.random() - 0.5) * 8000;
        const y = getTerrainHeight(x, z);
        
        const tree = new THREE.Group();
        
        // Ствол
        const trunkGeo = new THREE.CylinderGeometry(0.5, 0.8, 8, 8);
        const trunkMat = new THREE.MeshLambertMaterial({ color: 0x4a3728 });
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = 4;
        trunk.castShadow = true;
        tree.add(trunk);
        
        // Листва
        const leavesGeo = new THREE.SphereGeometry(4, 8, 8);
        const leavesMat = new THREE.MeshLambertMaterial({ color: 0x2d5016 });
        const leaves = new THREE.Mesh(leavesGeo, leavesMat);
        leaves.position.y = 10;
        leaves.castShadow = true;
        tree.add(leaves);
        
        tree.position.set(x, y, z);
        scene.add(tree);
        trees.push(tree);
    }
}

// Получение высоты ландшафта
function getTerrainHeight(x, z) {
    return Math.sin(x * 0.01) * 20 + Math.cos(z * 0.01) * 20 + 
           Math.sin(x * 0.005 + z * 0.005) * 40;
}

// Создание базы
function createBase(x, z, color) {
    const base = new THREE.Group();
    
    // Основание
    const baseGeo = new THREE.BoxGeometry(50, 10, 50);
    const baseMat = new THREE.MeshLambertMaterial({ color: color });
    const baseMesh = new THREE.Mesh(baseGeo, baseMat);
    baseMesh.position.y = 5;
    baseMesh.castShadow = true;
    baseMesh.receiveShadow = true;
    base.add(baseMesh);
    
    // Башня
    const towerGeo = new THREE.CylinderGeometry(8, 10, 20, 16);
    const towerMat = new THREE.MeshLambertMaterial({ color: color });
    const tower = new THREE.Mesh(towerGeo, towerMat);
    tower.position.y = 20;
    tower.castShadow = true;
    base.add(tower);
    
    // Флаг
    const flagPoleGeo = new THREE.CylinderGeometry(0.2, 0.2, 15, 8);
    const flagPoleMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
    const flagPole = new THREE.Mesh(flagPoleGeo, flagPoleMat);
    flagPole.position.y = 37.5;
    base.add(flagPole);
    
    const flagGeo = new THREE.PlaneGeometry(8, 5);
    const flagMat = new THREE.MeshLambertMaterial({ color: color, side: THREE.DoubleSide });
    const flag = new THREE.Mesh(flagGeo, flagMat);
    flag.position.set(4, 40, 0);
    base.add(flag);
    
    base.position.set(x, getTerrainHeight(x, z), z);
    base.userData = { hp: 1000, maxHp: 1000, type: 'base', color: color };
    scene.add(base);
    
    return base;
}

// Создание ПВО
function createAA(x, z, color, isPlayer = false) {
    const aa = new THREE.Group();
    
    // База
    const baseGeo = new THREE.BoxGeometry(8, 3, 8);
    const baseMat = new THREE.MeshLambertMaterial({ color: color });
    const baseMesh = new THREE.Mesh(baseGeo, baseMat);
    baseMesh.position.y = 1.5;
    baseMesh.castShadow = true;
    aa.add(baseMesh);
    
    // Вращающаяся башня
    const turret = new THREE.Group();
    const turretGeo = new THREE.CylinderGeometry(2, 2.5, 2, 16);
    const turretMat = new THREE.MeshLambertMaterial({ color: color });
    const turretMesh = new THREE.Mesh(turretGeo, turretMat);
    turretMesh.position.y = 1;
    turretMesh.castShadow = true;
    turret.add(turretMesh);
    
    // Радар
    const radarGeo = new THREE.BoxGeometry(0.5, 3, 0.5);
    const radarMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
    const radar = new THREE.Mesh(radarGeo, radarMat);
    radar.position.set(0, 3.5, 0);
    radar.castShadow = true;
    turret.add(radar);
    
    // Ствол
    const barrelGeo = new THREE.CylinderGeometry(0.3, 0.3, 6, 8);
    const barrelMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
    const barrel = new THREE.Mesh(barrelGeo, barrelMat);
    barrel.rotation.x = Math.PI / 2;
    barrel.position.set(0, 1, 3);
    barrel.castShadow = true;
    turret.add(barrel);
    
    turret.position.y = 3;
    aa.add(turret);
    
    const y = getTerrainHeight(x, z);
    aa.position.set(x, y, z);
    aa.userData = { 
        type: 'aa', 
        hp: 200, 
        maxHp: 200, 
        turret: turret,
        barrel: barrel,
        target: null,
        fireRate: 0.1,
        lastFire: 0,
        heat: 0,
        ammo: 100,
        color: color,
        isPlayer: isPlayer
    };
    
    scene.add(aa);
    return aa;
}

// Создание дрона
function createDrone(x, y, z, color, type = 'scout') {
    const drone = new THREE.Group();
    
    let bodyColor = 0x888888;
    let speed = 50;
    let hp = 50;
    let bombs = 0;
    
    if (type === 'scout') {
        bodyColor = 0xaaaaaa;
        speed = 80;
        hp = 30;
    } else if (type === 'strike') {
        bodyColor = 0x666666;
        speed = 40;
        hp = 150;
        bombs = 4;
    } else if (type === 'fpv') {
        bodyColor = 0xff4444;
        speed = 100;
        hp = 20;
    }
    
    // Корпус
    const bodyGeo = new THREE.BoxGeometry(2, 0.5, 4);
    const bodyMat = new THREE.MeshPhongMaterial({ color: bodyColor, shininess: 100 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.castShadow = true;
    drone.add(body);
    
    // Крылья
    const wingGeo = new THREE.BoxGeometry(6, 0.2, 1);
    const wingMat = new THREE.MeshPhongMaterial({ color: bodyColor, shininess: 100 });
    const wings = new THREE.Mesh(wingGeo, wingMat);
    wings.position.y = 0.1;
    wings.castShadow = true;
    drone.add(wings);
    
    // Хвост
    const tailGeo = new THREE.BoxGeometry(2, 0.2, 0.5);
    const tail = new THREE.Mesh(tailGeo, wingMat);
    tail.position.set(0, 0.1, -2);
    tail.castShadow = true;
    drone.add(tail);
    
    // Антенна
    const antennaGeo = new THREE.CylinderGeometry(0.05, 0.05, 1, 8);
    const antennaMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
    const antenna = new THREE.Mesh(antennaGeo, antennaMat);
    antenna.position.set(0, 0.75, 0);
    drone.add(antenna);
    
    // Бомбы (для ударного дрона)
    if (bombs > 0) {
        for (let i = 0; i < bombs; i++) {
            const bombGeo = new THREE.SphereGeometry(0.3, 8, 8);
            const bombMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
            const bomb = new THREE.Mesh(bombGeo, bombMat);
            bomb.position.set((i % 2) * 2 - 1, -0.5, (Math.floor(i / 2)) * 1.5 - 0.75);
            drone.add(bomb);
        }
    }
    
    drone.position.set(x, y, z);
    drone.userData = {
        type: 'drone',
        droneType: type,
        hp: hp,
        maxHp: hp,
        speed: speed,
        bombs: bombs,
        color: color,
        velocity: new THREE.Vector3(0, 0, -speed),
        targetAltitude: y,
        roll: 0,
        pitch: 0
    };
    
    scene.add(drone);
    return drone;
}

// Создание взрыва
function createExplosion(x, y, z, size = 1) {
    const explosion = new THREE.Group();
    
    // Огненный шар
    const fireGeo = new THREE.SphereGeometry(size * 5, 16, 16);
    const fireMat = new THREE.MeshBasicMaterial({ 
        color: 0xff6600, 
        transparent: true, 
        opacity: 0.8 
    });
    const fire = new THREE.Mesh(fireGeo, fireMat);
    explosion.add(fire);
    
    // Дым
    const smokeGeo = new THREE.SphereGeometry(size * 8, 16, 16);
    const smokeMat = new THREE.MeshBasicMaterial({ 
        color: 0x333333, 
        transparent: true, 
        opacity: 0.5 
    });
    const smoke = new THREE.Mesh(smokeGeo, smokeMat);
    explosion.add(smoke);
    
    // Искры
    for (let i = 0; i < 20; i++) {
        const sparkGeo = new THREE.SphereGeometry(0.2, 4, 4);
        const sparkMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const spark = new THREE.Mesh(sparkGeo, sparkMat);
        spark.position.set(
            (Math.random() - 0.5) * size * 10,
            (Math.random() - 0.5) * size * 10,
            (Math.random() - 0.5) * size * 10
        );
        spark.userData.velocity = new THREE.Vector3(
            (Math.random() - 0.5) * 50,
            Math.random() * 50,
            (Math.random() - 0.5) * 50
        );
        explosion.add(spark);
    }
    
    explosion.position.set(x, y, z);
    explosion.userData = { life: 2, maxLife: 2, size: size };
    scene.add(explosion);
    explosions.push(explosion);
    
    // Тряска камеры
    cameraShake = Math.max(cameraShake, size * 0.5);
    
    return explosion;
}

// Создание трассера
function createTracer(start, end, color = 0xffff00) {
    const material = new THREE.LineBasicMaterial({ color: color });
    const points = [start, end];
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const line = new THREE.Line(geometry, material);
    line.userData = { life: 0.5 };
    scene.add(line);
    projectiles.push(line);
    return line;
}
// Инициализация игры
function startGame(mode) {
    gameMode = mode;
    document.getElementById('mainMenu').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    
    initThree();
    createTerrain();
    createTrees();
    
    // Создание баз
    baseBlue = createBase(-4500, 0, 0x0066ff);
    baseRed = createBase(4500, 0, 0xff0000);
    allies.push(baseBlue);
    enemies.push(baseRed);
    
    // Создание игрока в зависимости от режима
    if (mode === 'training_aa' || mode === 'battle') {
        playerType = 'aa';
        player = createAA(-4000, 0, 0x0066ff, true);
        allies.push(player);
        document.getElementById('aaCrosshair').style.display = 'block';
        document.getElementById('heatBar').style.display = 'block';
        document.getElementById('ammoCount').style.display = 'block';
    } else if (mode === 'training_drone') {
        playerType = 'drone';
        player = createDrone(4000, 100, 0, 0xff0000, 'strike');
        enemies.push(player);
        lives = 3;
        document.getElementById('fpvHUD').style.display = 'block';
        document.getElementById('lives').style.display = 'block';
    }
    
    // Создание ботов для масштабной битвы
    if (mode === 'battle') {
        // Синие ПВО
        for (let i = 0; i < 5; i++) {
            const aa = createAA(-4000 + Math.random() * 500, Math.random() * 500 - 250, 0x0066ff);
            allies.push(aa);
        }
        
        // Красные ПВО
        for (let i = 0; i < 5; i++) {
            const aa = createAA(4000 - Math.random() * 500, Math.random() * 500 - 250, 0xff0000);
            enemies.push(aa);
        }
        
        // Синие дроны
        for (let i = 0; i < 8; i++) {
            const drone = createDrone(-3500 + Math.random() * 500, 100 + Math.random() * 100, Math.random() * 1000 - 500, 0x0066ff, 'strike');
            allies.push(drone);
        }
        
        // Красные дроны
        for (let i = 0; i < 8; i++) {
            const drone = createDrone(3500 - Math.random() * 500, 100 + Math.random() * 100, Math.random() * 1000 - 500, 0xff0000, 'strike');
            enemies.push(drone);
        }
    } else if (mode === 'training_aa') {
        // Для обучения ПВО - несколько красных дронов
        for (let i = 0; i < 5; i++) {
            const drone = createDrone(4000 - i * 500, 100, Math.random() * 200 - 100, 0xff0000, 'scout');
            enemies.push(drone);
        }
    } else if (mode === 'training_drone') {
        // Для обучения дрона - несколько синих ПВО
        for (let i = 0; i < 3; i++) {
            const aa = createAA(-3000 + i * 500, 0, 0x0066ff);
            allies.push(aa);
        }
    }
    
    gameState = 'playing';
    setupControls();
    animate();
}

// Настройка управления
function setupControls() {
    document.addEventListener('keydown', (e) => {
        keys[e.key.toLowerCase()] = true;
        
        if (e.key.toLowerCase() === 'c') {
            // Переключение вида камеры
            if (camera.position.distanceTo(player.position) > 10) {
                camera.position.copy(player.position);
            } else {
                camera.position.set(
                    player.position.x,
                    player.position.y + 10,
                    player.position.z + 20
                );
            }
        }
        
        if (e.key.toLowerCase() === 'b' && gameState === 'playing') {
            toggleShop();
        }
    });
    
    document.addEventListener('keyup', (e) => {
        keys[e.key.toLowerCase()] = false;
    });
    
    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement) {
            mouse.x += e.movementX * 0.002;
            mouse.y += e.movementY * 0.002;
            mouse.y = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, mouse.y));
        }
    });
    
    document.addEventListener('click', () => {
        if (gameState === 'playing' && !document.pointerLockElement) {
            renderer.domElement.requestPointerLock();
        } else if (gameState === 'playing' && document.pointerLockElement) {
            // Стрельба или сброс бомбы
            if (playerType === 'aa') {
                playerShoot();
            } else if (playerType === 'drone') {
                playerDropBomb();
            }
        }
    });
}

// Стрельба игрока-ПВО
function playerShoot() {
    if (player.userData.ammo <= 0 || player.userData.heat >= 100) return;
    
    const now = Date.now() / 1000;
    if (now - player.userData.lastFire < player.userData.fireRate) return;
    
    player.userData.lastFire = now;
    player.userData.ammo--;
    player.userData.heat = Math.min(100, player.userData.heat + 5);
    
    // Направление стрельбы
    const direction = new THREE.Vector3(0, 0, 1);
    direction.applyQuaternion(player.userData.turret.quaternion);
    direction.applyQuaternion(player.quaternion);
    
    const startPos = player.userData.turret.localToWorld(new THREE.Vector3(0, 1, 6));
    const endPos = startPos.clone().add(direction.multiplyScalar(500));
    
    createTracer(startPos, endPos, 0xffff00);
    
    // Проверка попаданий
    const raycaster = new THREE.Raycaster(startPos, direction.normalize(), 0, 500);
    const targets = enemies.filter(e => e.userData.type === 'drone' || e.userData.type === 'aa');
    
    targets.forEach(target => {
        const intersects = raycaster.intersectObject(target, true);
        if (intersects.length > 0) {
            const damage = upgrades.aa_gun ? 30 : 20;
            target.userData.hp -= damage;
            
            if (target.userData.hp <= 0) {
                createExplosion(target.position.x, target.position.y, target.position.z, 2);
                scene.remove(target);
                enemies.splice(enemies.indexOf(target), 1);
                credits += target.userData.type === 'drone' ? 50 : 100;
            }
        }
    });
}

// Сброс бомбы игроком-дроном
function playerDropBomb() {
    if (player.userData.bombs <= 0) return;
    
    player.userData.bombs--;
    
    const bomb = new THREE.Group();
    const bombGeo = new THREE.SphereGeometry(0.5, 8, 8);
    const bombMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
    const bombMesh = new THREE.Mesh(bombGeo, bombMat);
    bomb.add(bombMesh);
    
    bomb.position.copy(player.position);
    bomb.userData = {
        type: 'bomb',
        velocity: new THREE.Vector3(
            player.userData.velocity.x * 0.5,
            -10,
            player.userData.velocity.z * 0.5
        ),
        owner: player.userData.color
    };
    
    scene.add(bomb);
    projectiles.push(bomb);
}

// Обновление игрока
function updatePlayer(delta) {
    if (playerType === 'aa') {
        // Управление ПВО
        player.rotation.y = -mouse.x;
        
        const turret = player.userData.turret;
        turret.rotation.y = -mouse.x * 2;
        turret.rotation.x = -mouse.y;
        
        // Охлаждение
        player.userData.heat = Math.max(0, player.userData.heat - delta * 10);
        
        // Обновление HUD
        document.getElementById('heatBarFill').style.width = player.userData.heat + '%';
        document.getElementById('ammoValue').textContent = player.userData.ammo;
        
    } else if (playerType === 'drone') {
        // Управление дроном (механика SKYFIRE)
        const speed = player.userData.speed;
        
        // Наклон носа (pitch)
        if (keys['w'] || keys['arrowup']) {
            player.userData.pitch = Math.min(0.5, player.userData.pitch + delta * 2);
        } else if (keys['s'] || keys['arrowdown']) {
            player.userData.pitch = Math.max(-0.5, player.userData.pitch - delta * 2);
        } else {
            player.userData.pitch *= 0.95;
        }
        
        // Крен (roll)
        if (keys['a'] || keys['arrowleft']) {
            player.userData.roll = Math.min(0.8, player.userData.roll + delta * 2);
        } else if (keys['d'] || keys['arrowright']) {
            player.userData.roll = Math.max(-0.8, player.userData.roll - delta * 2);
        } else {
            player.userData.roll *= 0.95;
        }
        
        // Поворот по рысканью (yaw) от крена
        const yaw = -player.userData.roll * delta * 2;
        player.rotation.y += yaw;
        
        // Наклон и крен
        player.rotation.x = player.userData.pitch;
        player.rotation.z = player.userData.roll;
        
        // Движение вперед
        const forward = new THREE.Vector3(0, 0, -1);
        forward.applyQuaternion(player.quaternion);
        player.position.add(forward.multiplyScalar(speed * delta));
        
        // Управление высотой
        if (keys['shift']) {
            player.position.y += speed * delta * 0.5;
        } else if (keys['control']) {
            player.position.y -= speed * delta * 0.5;
        }
        
        // Гравитация
        if (player.position.y > 10) {
            player.position.y -= 5 * delta;
        }
        
        // Проверка столкновения с землей
        const terrainHeight = getTerrainHeight(player.position.x, player.position.z);
        if (player.position.y < terrainHeight + 2) {
            createExplosion(player.position.x, player.position.y, player.position.z, 3);
            lives--;
            
            if (lives <= 0) {
                endGame(false, 'Все дроны уничтожены');
            } else {
                // Респавн
                player.position.set(4000, 100, 0);
                player.userData.hp = player.userData.maxHp;
                player.userData.bombs = 4;
            }
        }
        
        // Обновление HUD FPV
        document.getElementById('speedIndicator').textContent = Math.round(speed * 3.6) + ' км/ч';
        document.getElementById('altitudeIndicator').textContent = Math.round(player.position.y) + ' м';
        document.getElementById('horizonInner').style.transform = 
            `translateY(${-player.userData.pitch * 100}px) rotate(${-player.userData.roll}rad)`;
        document.getElementById('livesValue').textContent = lives;
        
        // Камера от первого лица
        camera.position.copy(player.position);
        camera.rotation.copy(player.rotation);
    }
    
    // Камера от третьего лица
    if (camera.position.distanceTo(player.position) > 10) {
        const offset = new THREE.Vector3(0, 10, 20);
        offset.applyQuaternion(player.quaternion);
        camera.position.lerp(player.position.clone().add(offset), 0.1);
        camera.lookAt(player.position);
    }
}

// Обновление ИИ дронов
function updateDroneAI(drone, delta) {
    if (drone.userData.isPlayer) return;
    
    const speed = drone.userData.speed;
    
    // Простой ИИ: лететь к вражеской базе
    const targetBase = drone.userData.color === 0x0066ff ? baseRed : baseBlue;
    const direction = targetBase.position.clone().sub(drone.position).normalize();
    
    // Плавный поворот
    const targetRotation = Math.atan2(direction.x, direction.z);
    drone.rotation.y += (targetRotation - drone.rotation.y) * delta * 2;
    
    // Движение вперед
    const forward = new THREE.Vector3(0, 0, -1);
    forward.applyQuaternion(drone.quaternion);
    drone.position.add(forward.multiplyScalar(speed * delta));
    
    // Поддержание высоты
    const targetAltitude = 100 + Math.sin(Date.now() * 0.001) * 20;
    drone.position.y += (targetAltitude - drone.position.y) * delta;
    
    // Проверка столкновения с землей
    const terrainHeight = getTerrainHeight(drone.position.x, drone.position.z);
    if (drone.position.y < terrainHeight + 2) {
        createExplosion(drone.position.x, drone.position.y, drone.position.z, 2);
        scene.remove(drone);
        const array = drone.userData.color === 0x0066ff ? allies : enemies;
        array.splice(array.indexOf(drone), 1);
    }
}

// Обновление ИИ ПВО
function updateAAAI(aa, delta) {
    if (aa.userData.isPlayer) return;
    
    // Поиск ближайшего врага
    const enemyList = aa.userData.color === 0x0066ff ? enemies : allies;
    let closestEnemy = null;
    let closestDist = Infinity;
    
    enemyList.forEach(enemy => {
        if (enemy.userData.type === 'drone' || enemy.userData.type === 'aa') {
            const dist = aa.position.distanceTo(enemy.position);
            if (dist < closestDist && dist < 500) {
                closestDist = dist;
                closestEnemy = enemy;
            }
        }
    });
    
    if (closestEnemy) {
        // Поворот башни к цели
        const direction = closestEnemy.position.clone().sub(aa.position);
        const targetRotation = Math.atan2(direction.x, direction.z);
        aa.userData.turret.rotation.y += (targetRotation - aa.userData.turret.rotation.y) * delta * 3;
        
        const pitch = Math.atan2(direction.y, Math.sqrt(direction.x * direction.x + direction.z * direction.z));
        aa.userData.turret.rotation.x += (pitch - aa.userData.turret.rotation.x) * delta * 3;
        
        // Стрельба
        const now = Date.now() / 1000;
        if (now - aa.userData.lastFire > aa.userData.fireRate) {
            aa.userData.lastFire = now;
            
            const startPos = aa.userData.turret.localToWorld(new THREE.Vector3(0, 1, 6));
            const endPos = closestEnemy.position.clone();
            
            createTracer(startPos, endPos, aa.userData.color === 0x0066ff ? 0x00ffff : 0xff6600);
            
            // Шанс попадания
            if (Math.random() < 0.3) {
                const damage = 20;
                closestEnemy.userData.hp -= damage;
                
                if (closestEnemy.userData.hp <= 0) {
                    createExplosion(closestEnemy.position.x, closestEnemy.position.y, closestEnemy.position.z, 2);
                    scene.remove(closestEnemy);
                    enemyList.splice(enemyList.indexOf(closestEnemy), 1);
                    
                    if (closestEnemy === player) {
                        if (playerType === 'drone') {
                            lives--;
                            if (lives <= 0) {
                                endGame(false, 'Дрон уничтожен');
                            } else {
                                player.position.set(4000, 100, 0);
                                player.userData.hp = player.userData.maxHp;
                            }
                        }
                    } else {
                        credits += closestEnemy.userData.type === 'drone' ? 50 : 100;
                    }
                }
            }
        }
    }
}
// Обновление снарядов
function updateProjectiles(delta) {
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const proj = projectiles[i];
        
        if (proj.userData.type === 'bomb') {
            // Физика бомбы (парабола)
            proj.userData.velocity.y -= 20 * delta; // гравитация
            proj.position.add(proj.userData.velocity.clone().multiplyScalar(delta));
            
            // Проверка столкновения с землей
            const terrainHeight = getTerrainHeight(proj.position.x, proj.position.z);
            if (proj.position.y < terrainHeight) {
                createExplosion(proj.position.x, proj.position.y, proj.position.z, 2);
                
                // Урон по области
                const blastRadius = 30;
                const allTargets = [...allies, ...enemies];
                allTargets.forEach(target => {
                    if (target.userData.type === 'aa' || target.userData.type === 'base') {
                        const dist = proj.position.distanceTo(target.position);
                        if (dist < blastRadius) {
                            const damage = 100 * (1 - dist / blastRadius);
                            target.userData.hp -= damage;
                            
                            if (target.userData.hp <= 0 && target.userData.type === 'base') {
                                createExplosion(target.position.x, target.position.y, target.position.z, 5);
                                scene.remove(target);
                                
                                if (target === baseRed) {
                                    endGame(true, 'Вражеская база уничтожена!');
                                } else if (target === baseBlue) {
                                    endGame(false, 'Ваша база уничтожена!');
                                }
                            }
                        }
                    }
                });
                
                scene.remove(proj);
                projectiles.splice(i, 1);
                continue;
            }
            
            // Проверка столкновения с целями
            const allTargets = [...allies, ...enemies];
            allTargets.forEach(target => {
                if (target.userData.type === 'aa' || target.userData.type === 'base') {
                    const dist = proj.position.distanceTo(target.position);
                    if (dist < 10) {
                        createExplosion(proj.position.x, proj.position.y, proj.position.z, 2);
                        const damage = 100;
                        target.userData.hp -= damage;
                        
                        if (target.userData.hp <= 0 && target.userData.type === 'base') {
                            createExplosion(target.position.x, target.position.y, target.position.z, 5);
                            scene.remove(target);
                            
                            if (target === baseRed) {
                                endGame(true, 'Вражеская база уничтожена!');
                            } else if (target === baseBlue) {
                                endGame(false, 'Ваша база уничтожена!');
                            }
                        }
                        
                        scene.remove(proj);
                        projectiles.splice(i, 1);
                    }
                }
            });
        } else if (proj.userData.life !== undefined) {
            // Трассеры
            proj.userData.life -= delta;
            if (proj.userData.life <= 0) {
                scene.remove(proj);
                projectiles.splice(i, 1);
            }
        }
    }
}

// Обновление взрывов
function updateExplosions(delta) {
    for (let i = explosions.length - 1; i >= 0; i--) {
        const exp = explosions[i];
        exp.userData.life -= delta;
        
        const progress = 1 - (exp.userData.life / exp.userData.maxLife);
        
        // Анимация огня
        const fire = exp.children[0];
        fire.scale.setScalar(1 + progress * 2);
        fire.material.opacity = 0.8 * (1 - progress);
        
        // Анимация дыма
        const smoke = exp.children[1];
        smoke.scale.setScalar(1 + progress * 3);
        smoke.material.opacity = 0.5 * (1 - progress);
        smoke.position.y += delta * 10;
        
        // Анимация искр
        for (let j = 2; j < exp.children.length; j++) {
            const spark = exp.children[j];
            spark.position.add(spark.userData.velocity.clone().multiplyScalar(delta));
            spark.userData.velocity.y -= 50 * delta;
            spark.material.opacity = 1 - progress;
        }
        
        if (exp.userData.life <= 0) {
            scene.remove(exp);
            explosions.splice(i, 1);
        }
    }
}

// Обновление мини-карты
function updateMinimap() {
    const canvas = document.getElementById('minimapCanvas');
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, 200, 200);
    
    const scale = 200 / 10000;
    const offsetX = 100;
    const offsetY = 100;
    
    // Базы
    ctx.fillStyle = '#0066ff';
    ctx.fillRect(offsetX + baseBlue.position.x * scale - 3, offsetY + baseBlue.position.z * scale - 3, 6, 6);
    
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(offsetX + baseRed.position.x * scale - 3, offsetY + baseRed.position.z * scale - 3, 6, 6);
    
    // Игрок
    ctx.fillStyle = '#00ff88';
    ctx.beginPath();
    ctx.arc(offsetX + player.position.x * scale, offsetY + player.position.z * scale, 4, 0, Math.PI * 2);
    ctx.fill();
    
    // Союзники
    ctx.fillStyle = '#00ffff';
    allies.forEach(ally => {
        if (ally !== player && ally !== baseBlue) {
            ctx.beginPath();
            ctx.arc(offsetX + ally.position.x * scale, offsetY + ally.position.z * scale, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    });
    
    // Враги
    ctx.fillStyle = '#ff6600';
    enemies.forEach(enemy => {
        if (enemy !== baseRed) {
            ctx.beginPath();
            ctx.arc(offsetX + enemy.position.x * scale, offsetY + enemy.position.z * scale, 2, 0, Math.PI * 2);
            ctx.fill();
        }
    });
}

// Магазин
function toggleShop() {
    const shop = document.getElementById('shopMenu');
    if (shop.style.display === 'none' || shop.style.display === '') {
        shop.style.display = 'block';
        if (gameState === 'playing') {
            gameState = 'paused';
        }
    } else {
        shop.style.display = 'none';
        if (gameState === 'paused') {
            gameState = 'playing';
        }
    }
}

function buyUpgrade(type, cost) {
    if (credits >= cost && !upgrades[type]) {
        credits -= cost;
        upgrades[type] = true;
        document.getElementById('creditsValue').textContent = credits;
        
        // Применение улучшений
        if (type === 'aa_gun' && playerType === 'aa') {
            player.userData.fireRate = 0.07;
        } else if (type === 'aa_missile' && playerType === 'aa') {
            player.userData.fireRate = 0.5;
        } else if (type === 'drone_scout' && playerType === 'drone') {
            player.userData.speed = 100;
        } else if (type === 'drone_strike' && playerType === 'drone') {
            player.userData.bombs = 4;
        } else if (type === 'drone_fpv' && playerType === 'drone') {
            player.userData.speed = 120;
        }
        
        alert('Улучшение куплено!');
    } else if (upgrades[type]) {
        alert('Уже куплено!');
    } else {
        alert('Недостаточно кредитов!');
    }
}

// Завершение игры
function endGame(victory, message) {
    gameState = 'gameover';
    document.getElementById('gameOver').style.display = 'block';
    document.getElementById('gameOverText').textContent = message;
    
    if (victory) {
        document.getElementById('gameOver').querySelector('h2').textContent = 'ПОБЕДА!';
        document.getElementById('gameOver').querySelector('h2').style.color = '#00ff88';
        credits += 500;
    } else {
        document.getElementById('gameOver').querySelector('h2').textContent = 'ПОРАЖЕНИЕ';
        document.getElementById('gameOver').querySelector('h2').style.color = '#ff0000';
        credits += 100;
    }
    
    document.getElementById('creditsValue').textContent = credits;
}

// Главный игровой цикл
function animate() {
    requestAnimationFrame(animate);
    
    if (gameState !== 'playing') {
        renderer.render(scene, camera);
        return;
    }
    
    const delta = clock.getDelta();
    
    // Обновление таймера
    gameTime -= delta;
    if (gameTime <= 0) {
        // Проверка кто победил по очкам
        const blueScore = baseBlue.userData.hp;
        const redScore = baseRed.userData.hp;
        if (blueScore > redScore) {
            endGame(true, 'Время вышло! Вы победили по очкам!');
        } else {
            endGame(false, 'Время вышло! Вы проиграли по очкам!');
        }
    }
    
    const minutes = Math.floor(gameTime / 60);
    const seconds = Math.floor(gameTime % 60);
    document.getElementById('timer').textContent = 
        `${minutes}:${seconds.toString().padStart(2, '0')}`;
    
    // Обновление HP базы
    const hpPercent = (baseBlue.userData.hp / baseBlue.userData.maxHp) * 100;
    document.getElementById('baseHPBar').style.width = hpPercent + '%';
    
    // Обновление игрока
    updatePlayer(delta);
    
    // Обновление ИИ
    allies.forEach(ally => {
        if (ally.userData.type === 'drone') {
            updateDroneAI(ally, delta);
        } else if (ally.userData.type === 'aa') {
            updateAAAI(ally, delta);
        }
    });
    
    enemies.forEach(enemy => {
        if (enemy.userData.type === 'drone') {
            updateDroneAI(enemy, delta);
        } else if (enemy.userData.type === 'aa') {
            updateAAAI(enemy, delta);
        }
    });
    
    // Обновление снарядов и взрывов
    updateProjectiles(delta);
    updateExplosions(delta);
    
    // Тряска камеры
    if (cameraShake > 0) {
        camera.position.x += (Math.random() - 0.5) * cameraShake;
        camera.position.y += (Math.random() - 0.5) * cameraShake;
        cameraShake *= 0.9;
        if (cameraShake < 0.01) cameraShake = 0;
    }
    
    // Обновление мини-карты
    updateMinimap();
    
    // Обновление кредитов
    document.getElementById('creditsValue').textContent = credits;
    
    // Рендер
    renderer.render(scene, camera);
}

// Обработка ошибок
window.addEventListener('error', (e) => {
    console.error('Ошибка:', e.message);
});

// Предотвращение контекстного меню
document.addEventListener('contextmenu', (e) => e.preventDefault());
