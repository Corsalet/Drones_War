<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Drone vs AA</title>
<style>
body{margin:0;overflow:hidden;background:#87ceeb;font-family:monospace}
#hud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none}
#hp{position:absolute;bottom:20px;left:20px;width:200px;height:20px;border:2px solid #fff;background:#400}
#hpFill{height:100%;width:100%;background:#0f0;transition:width .1s}
#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:24px;font-weight:bold;text-shadow:0 0 3px #000}
#mini{position:absolute;bottom:20px;right:20px;width:180px;height:180px;border:2px solid #fff;background:rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="hud">
<div id="hp"><div id="hpFill"></div></div>
<div id="cross">+</div>
<canvas id="mini" width="180" height="180"></canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== Scene =====
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,2000,4500);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,1,6000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const hemi=new THREE.HemisphereLight(0xffffff,0x444444,0.9);
scene.add(hemi);
const dir=new THREE.DirectionalLight(0xffffff,0.6);
dir.position.set(500,1000,300);
scene.add(dir);

// ===== Terrain =====
const SIZE=5000;
function heightAt(x,z){return Math.sin(x*0.002)*30+Math.cos(z*0.0015)*25+Math.sin((x+z)*0.001)*15;}
const geo=new THREE.PlaneGeometry(SIZE,SIZE,80,80);
geo.rotateX(-Math.PI/2);
const pos=geo.attributes.position;
for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);pos.setY(i,heightAt(x,z));}
geo.computeVertexNormals();
const ground=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:0x2e8b57}));
scene.add(ground);

// Raycaster for height
const ray=new THREE.Raycaster();
const down=new THREE.Vector3(0,-1,0);
function groundY(x,z){
  ray.set(new THREE.Vector3(x,1000,z),down);
  const hits=ray.intersectObject(ground);
  return hits.length?hits[0].point.y:heightAt(x,z);
}

// Trees
const treeGeo=new THREE.ConeGeometry(15,50,6);
const treeMat=new THREE.MeshLambertMaterial({color:0x1a5d1a});
for(let i=0;i<120;i++){
  const x=(Math.random()-0.5)*SIZE*0.9, z=(Math.random()-0.5)*SIZE*0.9;
  const t=new THREE.Mesh(treeGeo,treeMat);
  const y=groundY(x,z);
  t.position.set(x,y+25,z);
  scene.add(t);
}
// Houses
const houseMat=new THREE.MeshLambertMaterial({color:0xccaa77});
const roofMat=new THREE.MeshLambertMaterial({color:0x8b4513});
for(let i=0;i<50;i++){
  const x=(Math.random()-0.5)*SIZE*0.9, z=(Math.random()-0.5)*SIZE*0.9;
  const y=groundY(x,z);
  const b=new THREE.Mesh(new THREE.BoxGeometry(60,40,80),houseMat);
  b.position.set(x,y+20,z);
  b.rotation.y=Math.random()*Math.PI;
  scene.add(b);
  const r=new THREE.Mesh(new THREE.ConeGeometry(55,30,4),roofMat);
  r.position.set(x,y+55,z);
  r.rotation.y=b.rotation.y+Math.PI/4;
  scene.add(r);
}

// ===== Player Drone =====
const droneGroup=new THREE.Group();
const bodyMat=new THREE.MeshLambertMaterial({color:0x4444ff});
const wingMat=new THREE.MeshLambertMaterial({color:0x2222aa});
const body=new THREE.Mesh(new THREE.BoxGeometry(20,8,40),bodyMat);
droneGroup.add(body);
const wing=new THREE.Mesh(new THREE.BoxGeometry(80,3,15),wingMat);
wing.position.y=3;droneGroup.add(wing);
const tail=new THREE.Mesh(new THREE.BoxGeometry(30,3,10),wingMat);
tail.position.set(0,3,-18);droneGroup.add(tail);
scene.add(droneGroup);

const player={pos:new THREE.Vector3(0,groundY(0,0)+200,0),yaw:0,hp:100,alive:true,speed:120};
droneGroup.position.copy(player.pos);

// ===== Controls =====
const keys={};
addEventListener('keydown',e=>keys[e.code]=true);
addEventListener('keyup',e=>keys[e.code]=false);

// ===== Minimap =====
const mini=document.getElementById('mini');
const mctx=mini.getContext('2d');
function drawMini(){
  mctx.clearRect(0,0,180,180);
  mctx.fillStyle='rgba(0,0,0,0.4)';mctx.fillRect(0,0,180,180);
  const scale=180/SIZE;
  const cx=90,cy=90;
  // player dot
  mctx.fillStyle='#fff';
  mctx.beginPath();mctx.arc(cx,cy,4,0,7);mctx.fill();
  // direction line
  mctx.strokeStyle='#fff';mctx.beginPath();mctx.moveTo(cx,cy);
  mctx.lineTo(cx-Math.sin(player.yaw)*20,cy-Math.cos(player.yaw)*20);mctx.stroke();
}

// ===== HUD =====
const hpFill=document.getElementById('hpFill');
function updateHUD(){hpFill.style.width=Math.max(0,player.hp)+'%';hpFill.style.background=player.hp>50?'#0f0':player.hp>25?'#ff0':'#f00';}

// ===== Loop =====
const clock=new THREE.Clock();
const camOffset=new THREE.Vector3(0,60,-140);
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  if(player.alive){
    // Yaw control
    let turn=0;
    if(keys['KeyA']||keys['ArrowLeft'])turn+=1;
    if(keys['KeyD']||keys['ArrowRight'])turn-=1;
    player.yaw+=turn*1.8*dt;
    // Move forward
    let mv=0;
    if(keys['KeyW']||keys['ArrowUp'])mv=1;
    if(keys['KeyS']||keys['ArrowDown'])mv=-0.5;
    const fx=-Math.sin(player.yaw),fz=-Math.cos(player.yaw);
    player.pos.x+=fx*player.speed*mv*dt;
    player.pos.z+=fz*player.speed*mv*dt;
    // clamp to map
    const lim=SIZE/2-100;
    player.pos.x=Math.max(-lim,Math.min(lim,player.pos.x));
    player.pos.z=Math.max(-lim,Math.min(lim,player.pos.z));
    // altitude follow terrain
    const gy=groundY(player.pos.x,player.pos.z);
    const minY=gy+80;
    player.pos.y=Math.max(minY,player.pos.y);
    // slight auto descend
    if(player.pos.y>minY+1)player.pos.y-=20*dt;
    // apply
    droneGroup.position.copy(player.pos);
    droneGroup.rotation.y=player.yaw;
    // Camera follows with yaw
    const cx=player.pos.x+Math.sin(player.yaw)*140;
    const cz=player.pos.z+Math.cos(player.yaw)*140;
    camera.position.set(cx,player.pos.y+60,cz);
    camera.lookAt(player.pos.x,player.pos.y,player.pos.z);
  }
  updateHUD();
  drawMini();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
