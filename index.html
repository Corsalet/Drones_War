<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Drone vs AA - V5</title>
<style>
body{margin:0;overflow:hidden;background:#000;font-family:'Segoe UI',Tahoma,Verdana,sans-serif;user-select:none;cursor:crosshair}
canvas{display:block}
#hud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;display:none}
#menu-btn{position:absolute;top:20px;left:20px;background:rgba(0,0,0,0.7);border:2px solid #00aaff;color:#fff;padding:10px 20px;font-size:16px;cursor:pointer;border-radius:8px;pointer-events:auto;transition:0.2s}
#menu-btn:hover{background:#00aaff}
#hp-bar{position:absolute;bottom:30px;left:30px;width:300px;height:24px;border:2px solid rgba(255,255,255,0.8);background:rgba(0,0,0,0.5);border-radius:12px;overflow:hidden;box-shadow:0 0 10px rgba(0,0,0,0.5)}
#hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#00ff00,#88ff00);transition:width .2s}
#hp-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-weight:bold;font-size:14px;text-shadow:1px 1px 2px #000}
#minimap{position:absolute;bottom:30px;right:30px;width:220px;height:220px;border:2px solid rgba(255,255,255,0.8);background:rgba(0,0,0,0.6);border-radius:50%;box-shadow:0 0 15px rgba(0,0,0,0.7)}
#score{position:absolute;top:20px;right:30px;color:#fff;font-size:20px;font-weight:bold;text-shadow:1px 1px 3px #000;text-align:right}
#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border:2px solid rgba(255,255,255,0.8);border-radius:50%;display:flex;justify-content:center;align-items:center;box-shadow:0 0 5px rgba(0,0,0,0.5);display:none}
#cross::before,#cross::after{content:'';position:absolute;background:#fff}
#cross::before{width:2px;height:12px;top:-8px;box-shadow:0 48px 0 #fff}
#cross::after{width:12px;height:2px;left:-8px;box-shadow:48px 0 0 #fff}
#aa-cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;border:2px dashed #ff3333;border-radius:50%;display:none;pointer-events:none;box-shadow:0 0 10px rgba(255,0,0,0.5)}
#aa-cross::before,#aa-cross::after{content:'';position:absolute;background:#ff3333}
#aa-cross::before{width:2px;height:20px;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 5px #ff0000}
#aa-cross::after{width:20px;height:2px;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 5px #ff0000}
.marker{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.marker-name{font-size:12px;font-weight:bold;text-shadow:1px 1px 2px #000;margin-bottom:2px}
.marker-bar{width:60px;height:6px;background:rgba(0,0,0,0.5);border:1px solid #fff;border-radius:3px;overflow:hidden}
.marker-fill{height:100%;width:100%;background:#ff4444}
.enemy .marker-name{color:#ff4444}
.ally .marker-name{color:#44aaff}
.ally .marker-fill{background:#44aaff}
.dmg{position:absolute;color:#ff4444;font-weight:bold;font-size:24px;text-shadow:1px 1px 3px #000;pointer-events:none;animation:floatUp 1s forwards}
@keyframes floatUp{to{transform:translateY(-60px);opacity:0}}
#menu,#win-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.9));display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;z-index:100}
#win-screen{display:none;background:rgba(0,50,0,0.8)}
#menu h1,#win-screen h1{font-size:48px;margin-bottom:40px;text-shadow:0 0 20px #00aaff}
#win-screen h1{color:#00ff00;text-shadow:0 0 20px #00ff00}
.btn{background:rgba(0,0,0,0.6);border:2px solid #00aaff;color:#fff;padding:15px 40px;margin:10px;font-size:24px;cursor:pointer;border-radius:8px;transition:0.3s;box-shadow:0 0 10px rgba(0,170,255,0.5)}
.btn:hover{background:#00aaff;box-shadow:0 0 20px #00aaff}
#respawn-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(50,0,0,0.8);display:none;flex-direction:column;justify-content:center;align-items:center;color:#fff;z-index:50}
#respawn-screen h2{font-size:40px;margin-bottom:20px;color:#ff4444}
#respawn-timer{font-size:60px;font-weight:bold}
</style>
</head>
<body>
<div id="menu">
<h1>Drone vs AA</h1>
<button class="btn" id="btn-drone">Играть за Дрон</button>
<button class="btn" id="btn-aa">Играть за ПВО</button>
<div style="margin-top:20px;font-size:14px;color:#aaa;text-align:center;line-height:1.5">
<b>Дрон:</b> W/S - Вперед/Назад | A/D - Поворот | Space/Shift - Вверх/Вниз | ЛКМ - Бомба<br>
<b>ПВО:</b> Мышь - Наведение | ЛКМ - Огонь
</div>
</div>
<div id="win-screen">
<h1>ПОБЕДА!</h1>
<p style="font-size:20px;margin-bottom:30px">Вы уничтожили все силы противника.</p>
<button class="btn" onclick="location.reload()">В главное меню</button>
</div>
<div id="respawn-screen">
<h2>ВАС СБИЛИ</h2>
<div id="respawn-timer">5</div>
</div>
<div id="hud">
<button id="menu-btn" onclick="location.reload()">В МЕНЮ</button>
<div id="score">Целей уничтожено: 0 / 5</div>
<div id="hp-bar"><div id="hp-fill"></div><div id="hp-text">100 / 100 HP</div></div>
<canvas id="minimap" width="220" height="220"></canvas>
<div id="cross"></div>
<div id="aa-cross"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== Globals =====
const SIZE=5000, TEAM_BLUE=0, TEAM_RED=1;
let scene,camera,renderer,clock,gameMode='none',playerEntity,isDead=false,respawnTime=0,deaths=0,kills=0;
const projectiles=[], entities=[];
const bombPathLine=new THREE.Line();
const keys={};
const mouse={x:0,y:0,sensitivity:0.002};
const raycaster=new THREE.Raycaster();
let groundMesh;

// ===== Init =====
function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0xaaccff);
  scene.fog=new THREE.FogExp2(0xaaccff,0.0003);
  
  camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,10000);
  renderer=new THREE.WebGLRenderer({antialias:true,logarithmicDepthBuffer:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  document.body.insertBefore(renderer.domElement,document.getElementById('hud'));
  
  clock=new THREE.Clock();
  
  const hemi=new THREE.HemisphereLight(0xffffff,0x224422,0.7); scene.add(hemi);
  const sun=new THREE.DirectionalLight(0xfff5e6,1.2);
  sun.position.set(1000,2000,500);
  sun.castShadow=true; sun.shadow.camera.top=3000; sun.shadow.camera.bottom=-3000;
  sun.shadow.camera.left=-3000; sun.shadow.camera.right=3000;
  sun.shadow.mapSize.width=2048; sun.shadow.mapSize.height=2048;
  scene.add(sun);
  
  buildTerrain();
  spawnWorld();
  
  const pathGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);
  bombPathLine.geometry=pathGeo;
  bombPathLine.material=new THREE.LineDashedMaterial({color:0xff0000,dashSize:10,gapSize:10,transparent:true,opacity:0.8});
  scene.add(bombPathLine);
  
  setupEvents();
  animate();
}

// ===== Terrain =====
function heightAt(x,z){
  let h = Math.sin(x*0.002)*50 + Math.cos(z*0.0025)*40 + Math.sin(x*0.01 + z*0.005)*15;
  h += Math.exp(-((x-1000)**2 + (z-1000)**2)/500000)*300;
  h += Math.exp(-((x+1500)**2 + (z+500)**2)/800000)*400;
  return h;
}
function buildTerrain(){
  const geo=new THREE.PlaneGeometry(SIZE,SIZE,150,150);geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){pos.setY(i,heightAt(pos.getX(i),pos.getZ(i)));}
  geo.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({color:0x4a7c45,roughness:0.9,metalness:0.1});
  groundMesh=new THREE.Mesh(geo,mat);groundMesh.receiveShadow=true;scene.add(groundMesh);
}
function groundY(x,z){raycaster.set(new THREE.Vector3(x,2000,z),new THREE.Vector3(0,-1,0));const hits=raycaster.intersectObject(groundMesh);return hits.length?hits[0].point.y:heightAt(x,z);}

// ===== World Gen =====
function createAA(team,x,z){
  const group=new THREE.Group();group.position.set(x,groundY(x,z),z);
  const color=team===TEAM_BLUE?0x0055ff:0xaa0000;
  
  const base=new THREE.Mesh(new THREE.CylinderGeometry(20,25,15,8),new THREE.MeshStandardMaterial({color:0x333333,roughness:0.8}));
  base.position.y=7.5;base.castShadow=true;base.receiveShadow=true;group.add(base);
  
  const cab=new THREE.Mesh(new THREE.BoxGeometry(25,15,30),new THREE.MeshStandardMaterial({color:color,roughness:0.5}));
  cab.position.y=22;cab.castShadow=true;group.add(cab);
  
  const barrels=new THREE.Group();barrels.position.set(0,22,15);
  for(let i=-1;i<=1;i+=2){
    const b=new THREE.Mesh(new THREE.CylinderGeometry(2,3,40,8),new THREE.MeshStandardMaterial({color:0x111111,metalness:0.8}));
    b.rotation.x=Math.PI/2;b.position.set(i*8,0,20);b.castShadow=true;barrels.add(b);
  }
  group.add(barrels);scene.add(group);
  
  const el=document.createElement('div');el.className='marker '+(team===TEAM_BLUE?'ally':'enemy');
  el.innerHTML=`<div class="marker-name">ПВО</div><div class="marker-bar"><div class="marker-fill"></div></div>`;
  document.getElementById('hud').appendChild(el);
  
  const ent={type:'aa',team,mesh:group,barrels,pos:group.position,hp:100,maxHp:100,alive:true,cd:Math.random()*3,marker:el,targetYaw:0,targetPitch:0};
  entities.push(ent);return ent;
}

function createDrone(team,x,y,z){
  const group=new THREE.Group();group.position.set(x,y,z);
  // Поворот модели на 180 градусов, чтобы летел "лицом" вперед (по оси -Z)
  group.rotation.y = Math.PI; 
  
  const color=team===TEAM_BLUE?0x00aaff:0xff3333;
  const body=new THREE.Mesh(new THREE.CylinderGeometry(6,6,30,8),new THREE.MeshStandardMaterial({color:0x222222,metalness:0.5}));
  body.rotation.x=Math.PI/2;body.castShadow=true;group.add(body);
  const cockpit=new THREE.Mesh(new THREE.SphereGeometry(8,8,8),new THREE.MeshStandardMaterial({color:0x111111,roughness:0.2}));
  cockpit.position.set(0,4,-5);cockpit.scale.set(1,0.6,1.5);cockpit.castShadow=true;group.add(cockpit);
  
  const arms=new THREE.Group();
  for(let i=0;i<4;i++){
    const angle = Math.PI/4 + i*(Math.PI/2);
    const arm=new THREE.Mesh(new THREE.BoxGeometry(40,2,4),new THREE.MeshStandardMaterial({color:color}));
    arm.position.set(Math.cos(angle)*20, 0, Math.sin(angle)*20);
    arm.rotation.y = -angle;arm.castShadow=true;arms.add(arm);
    const rotor=new THREE.Mesh(new THREE.CylinderGeometry(10,10,1,12),new THREE.MeshStandardMaterial({color:0x666666,transparent:true,opacity:0.7}));
    rotor.position.set(Math.cos(angle)*40, 2, Math.sin(angle)*40);arms.add(rotor);
  }
  group.add(arms);scene.add(group);
  
  const el=document.createElement('div');el.className='marker '+(team===TEAM_BLUE?'ally':'enemy');
  el.innerHTML=`<div class="marker-name">Дрон</div><div class="marker-bar"><div class="marker-fill"></div></div>`;
  document.getElementById('hud').appendChild(el);
  
  const ent={type:'drone',team,mesh:group,pos:group.position,yaw:0,hp:100,maxHp:100,alive:true,speed:150,velocity:new THREE.Vector3(),marker:el,aiTimer:0};
  entities.push(ent);return ent;
}

function createBase(team,x,z){
  const group=new THREE.Group();group.position.set(x,groundY(x,z),z);
  const color=team===TEAM_BLUE?0x0055ff:0xaa0000;
  const b=new THREE.Mesh(new THREE.BoxGeometry(150,60,150),new THREE.MeshStandardMaterial({color:0x444444}));b.position.y=30;b.castShadow=true;b.receiveShadow=true;group.add(b);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(120,40,4),new THREE.MeshStandardMaterial({color:color}));roof.position.y=80;roof.rotation.y=Math.PI/4;roof.castShadow=true;group.add(roof);
  scene.add(group);
}

function spawnWorld(){
  createBase(TEAM_BLUE, -2000, 0); createBase(TEAM_RED, 2000, 0);
  
  for(let i=0;i<5;i++) createAA(TEAM_RED, 800+Math.random()*800, (Math.random()-0.5)*2000);
  for(let i=0;i<5;i++) createAA(TEAM_BLUE, -800-Math.random()*800, (Math.random()-0.5)*2000);
  
  // Вражеские дроны (цели для наших ПВО)
  for(let i=0;i<5;i++) createDrone(TEAM_RED, 1000+Math.random()*800, 400+Math.random()*200, (Math.random()-0.5)*1000);
  
  const treeGeo=new THREE.ConeGeometry(20,60,7);const treeMat=new THREE.MeshStandardMaterial({color:0x1a5d1a});
  const rockGeo=new THREE.DodecahedronGeometry(15);const rockMat=new THREE.MeshStandardMaterial({color:0x888888,roughness:1});
  
  for(let i=0;i<300;i++){
    const x=(Math.random()-0.5)*SIZE*0.9, z=(Math.random()-0.5)*SIZE*0.9;
    if(Math.abs(x)<800)continue;
    const y=groundY(x,z);
    if(Math.random()>0.3){
      const t=new THREE.Mesh(treeGeo,treeMat);t.position.set(x,y+30,z);t.scale.setScalar(0.8+Math.random());t.castShadow=true;t.receiveShadow=true;scene.add(t);
    }else{
      const r=new THREE.Mesh(rockGeo,rockMat);r.position.set(x,y+5,z);r.rotation.set(Math.random(),Math.random(),Math.random());r.castShadow=true;r.receiveShadow=true;scene.add(r);
    }
  }
}

// ===== Input =====
function setupEvents(){
  addEventListener('keydown',e=>keys[e.code]=true);
  addEventListener('keyup',e=>keys[e.code]=false);
  
  addEventListener('mousemove',e=>{
    mouse.x=(e.clientX/innerWidth)*2-1;
    mouse.y=-(e.clientY/innerHeight)*2+1;
  });
  
  addEventListener('mousedown',e=>{if(!isDead&&gameMode!=='none'&&e.button===0)shoot();});
  addEventListener('contextmenu',e=>e.preventDefault());

  document.getElementById('btn-drone').onclick=()=>startGame('drone');
  document.getElementById('btn-aa').onclick=()=>startGame('aa');
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
}

function startGame(mode){
  gameMode=mode;
  document.getElementById('menu').style.display='none';
  document.getElementById('hud').style.display='block';
  document.getElementById('cross').style.display=mode==='drone'?'flex':'none';
  document.getElementById('aa-cross').style.display=mode==='aa'?'block':'none';
  
  if(mode==='drone'){
    playerEntity=createDrone(TEAM_BLUE, -1500, 400, 0);
  }else{
    playerEntity=createAA(TEAM_BLUE, -1500, 0);
    playerEntity.mesh.visible=false;
  }
  deaths=0; kills=0; isDead=false; document.getElementById('respawn-screen').style.display='none';
}

// ===== Combat =====
function shoot(){
  if(gameMode==='drone'){
    const bomb=new THREE.Mesh(new THREE.CylinderGeometry(3,3,12,8),new THREE.MeshStandardMaterial({color:0x111111,metalness:0.8}));
    bomb.rotation.x=Math.PI/2;
    const fwd=new THREE.Vector3(-Math.sin(playerEntity.yaw),0,-Math.cos(playerEntity.yaw));
    bomb.position.copy(playerEntity.pos).add(fwd.clone().multiplyScalar(30));
    bomb.position.y-=10;bomb.castShadow=true;scene.add(bomb);
    projectiles.push({mesh:bomb,vel:fwd.clone().multiplyScalar(150).add(new THREE.Vector3(0,-10,0)),isBomb:true,life:10,dmg:50,team:playerEntity.team});
  }else{
    // Стрельба ПВО строго в центр экрана
    const dir=new THREE.Vector3();
    camera.getWorldDirection(dir);
    const startPos=playerEntity.pos.clone();startPos.y+=22;
    
    const b=new THREE.Mesh(new THREE.SphereGeometry(2,4,4),new THREE.MeshBasicMaterial({color:0x00ffff}));
    b.position.copy(startPos).add(dir.clone().multiplyScalar(30));scene.add(b);
    projectiles.push({mesh:b,vel:dir.multiplyScalar(600),isBomb:false,life:5,dmg:25,team:playerEntity.team});
  }
}

function findNearestEnemy(pos,myTeam,type){
  let nearest=null,minD=3000;
  entities.forEach(e=>{
    if(e.alive&&e.team!==myTeam&&e.type===type){
      const d=e.pos.distanceTo(pos);if(d<minD){minD=d;nearest=e;}
    }
  });
  return nearest;
}

function applyDamage(ent,dmg){
  ent.hp-=dmg;
  if(ent.hp<=0){
    ent.hp=0;ent.alive=false;ent.mesh.visible=false;
    if(ent.marker)ent.marker.style.display='none';
    if(ent.team===TEAM_RED){kills++;document.getElementById('score').innerText=`Целей уничтожено: ${kills} / 5`;}
  }
}

// ===== Update Loop =====
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.1);
  
  if(gameMode!=='none'&&!isDead){
    updatePlayer(dt);
    updateEntities(dt);
    updateProjectiles(dt);
    updateCamera(dt);
    updateHUD();
  }
  
  if(isDead){
    respawnTime-=dt;
    document.getElementById('respawn-timer').innerText=Math.ceil(respawnTime);
    if(respawnTime<=0){
      if(deaths>=10){alert('Вы проиграли!');location.reload();}
      else{respawnPlayer();}
    }
  }
  
  if(kills>=5 && gameMode!=='none'){
    document.getElementById('win-screen').style.display='flex';
    document.getElementById('hud').style.display='none';
    gameMode='none';
  }
  
  renderer.render(scene,camera);
}

function updatePlayer(dt){
  const p=playerEntity;
  if(gameMode==='drone'){
    let turn=(keys['KeyA']||keys['ArrowLeft']?1:0)-(keys['KeyD']||keys['ArrowRight']?1:0);
    p.yaw+=turn*1.5*dt;
    
    let mv=(keys['KeyW']||keys['ArrowUp']?1:0)-(keys['KeyS']||keys['ArrowDown']?0.5:0);
    let up=(keys['Space']?1:0)-(keys['ShiftLeft']||keys['ControlLeft']?1:0);
    
    const targetVel=new THREE.Vector3(-Math.sin(p.yaw)*p.speed*mv, up*100, -Math.cos(p.yaw)*p.speed*mv);
    p.velocity.lerp(targetVel, dt*3);
    
    p.pos.add(p.velocity.clone().multiplyScalar(dt));
    
    const lim=SIZE/2-100;p.pos.x=Math.max(-lim,Math.min(lim,p.pos.x));p.pos.z=Math.max(-lim,Math.min(lim,p.pos.z));
    const minY=groundY(p.pos.x,p.pos.z)+30;p.pos.y=Math.max(minY,p.pos.y);
    
    p.mesh.position.copy(p.pos);
    p.mesh.rotation.y=p.yaw + Math.PI; // + PI так как модель изначально развернута
    
    // Наклон вперед/назад и крен
    const targetPitch = (mv>0? 0.3 : (mv<0? -0.3 : 0)) + (up*0.1);
    p.mesh.rotation.x = THREE.MathUtils.lerp(p.mesh.rotation.x, -targetPitch, dt*5);
    p.mesh.rotation.z = THREE.MathUtils.lerp(p.mesh.rotation.z, -turn*0.4, dt*5);
    
    // Траектория бомбы
    const start=p.pos.clone();
    let curr=start.clone();let vel=new THREE.Vector3(-Math.sin(p.yaw)*p.speed*mv, 0, -Math.cos(p.yaw)*p.speed*mv);
    const points=[curr.clone()];
    for(let i=0;i<40;i++){
      vel.y-=9.8*10*dt*2;
      curr.add(vel.clone().multiplyScalar(dt*2));
      points.push(curr.clone());
      if(curr.y<groundY(curr.x,curr.z))break;
    }
    if(points.length>1){bombPathLine.geometry.setFromPoints(points);bombPathLine.computeLineDistances();bombPathLine.visible=true;}
  }else{
    // ПВО: наведение строго мышью (как в шутере)
    p.yaw -= mouse.x * mouse.sensitivity;
    p.pitch = (p.pitch || 0) - mouse.y * mouse.sensitivity;
    p.pitch = Math.max(-0.2, Math.min(Math.PI/2.5, p.pitch));
    
    p.mesh.rotation.y = p.yaw;
    p.barrels.rotation.x = -p.pitch;
  }
}

function updateCamera(dt){
  const p=playerEntity;
  if(gameMode==='drone'){
    const camOffset=new THREE.Vector3(Math.sin(p.yaw)*180, 60, Math.cos(p.yaw)*180);
    const targetPos=p.pos.clone().add(camOffset);
    camera.position.lerp(targetPos,dt*4);
    camera.lookAt(p.pos.clone().add(new THREE.Vector3(0,20,0)));
    bombPathLine.visible=true;
  }else{
    // Камера ПВО вращается вместе с башней
    camera.position.set(p.pos.x, p.pos.y+22, p.pos.z);
    camera.rotation.set(p.pitch, p.yaw, 0, 'YXZ');
    bombPathLine.visible=false;
  }
}

function updateEntities(dt){
  entities.forEach(e=>{
    if(!e.alive)return;
    
    if(e.type==='drone' && e!==playerEntity){
      // ИИ дронов (летают кругами)
      e.aiTimer-=dt;
      if(e.aiTimer<=0){
        e.aiTimer=2+Math.random()*2;
        e.yaw += (Math.random()-0.5)*0.5;
      }
      const targetVel=new THREE.Vector3(-Math.sin(e.yaw)*e.speed, 0, -Math.cos(e.yaw)*e.speed);
      e.velocity.lerp(targetVel, dt*2);
      e.pos.add(e.velocity.clone().multiplyScalar(dt));
      const lim=SIZE/2-200;e.pos.x=Math.max(-lim,Math.min(lim,e.pos.x));e.pos.z=Math.max(-lim,Math.min(lim,e.pos.z));
      e.pos.y=Math.max(groundY(e.pos.x,e.pos.z)+150, e.pos.y);
      
      e.mesh.position.copy(e.pos);
      e.mesh.rotation.y=e.yaw + Math.PI;
    }
    
    if(e.type==='aa'&&e!==playerEntity){
      // ИИ ПВО стреляет по дронам
      let target=findNearestEnemy(e.pos,e.team,'drone');
      if(target){
        const dx=target.pos.x-e.pos.x,dz=target.pos.z-e.pos.z,dy=target.pos.y-e.pos.y;
        const dist=Math.sqrt(dx*dx+dz*dz);
        e.targetYaw=Math.atan2(dx,dz);
        e.targetPitch=Math.atan2(dy,dist);
        
        e.mesh.rotation.y=THREE.MathUtils.lerp(e.mesh.rotation.y, e.targetYaw, dt*2);
        e.barrels.rotation.x=THREE.MathUtils.lerp(e.barrels.rotation.x, -e.targetPitch, dt*2);
        
        e.cd-=dt;
        if(e.cd<=0&&dist<2000){
          e.cd=1.5+Math.random()*1.5;
          const b=new THREE.Mesh(new THREE.SphereGeometry(3,6,6),new THREE.MeshBasicMaterial({color:e.team===TEAM_BLUE?0x00ffff:0xff0000}));
          b.position.copy(e.pos);b.position.y+=22;
          const aim=target.pos.clone().add(new THREE.Vector3((Math.random()-0.5)*50,(Math.random()-0.5)*50,(Math.random()-0.5)*50));
          const dir=aim.sub(b.position).normalize();
          scene.add(b);
          projectiles.push({mesh:b,vel:dir.multiplyScalar(450),isBomb:false,life:5,dmg:25,team:e.team});
        }
      }
    }
  });
}

function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];p.life-=dt;
    p.mesh.position.add(p.vel.clone().multiplyScalar(dt));
    if(p.isBomb)p.vel.y-=9.8*15*dt;
    
    let hit=false;
    
    entities.forEach(e=>{
      if(e.alive&&e.team!==p.team&&e!==playerEntity){
        const r=e.type==='drone'?40:30;
        if(p.mesh.position.distanceTo(e.pos)<r){
          applyDamage(e,p.dmg);hit=true;createExplosion(p.mesh.position);
        }
      }
      if(e===playerEntity&&e.alive&&e.team!==p.team){
        if(p.mesh.position.distanceTo(e.pos)<30){
          applyDamage(e,p.dmg);hit=true;createExplosion(p.mesh.position);
          const v=p.mesh.position.clone().project(camera);
          spawnDmgText('-'+p.dmg,(v.x*0.5+0.5)*innerWidth,(-v.y*0.5+0.5)*innerHeight);
          if(e.hp<=0)playerDie();
        }
      }
    });
    
    if(hit||p.life<=0||p.mesh.position.y<groundY(p.mesh.position.x,p.mesh.position.z)){
      createExplosion(p.mesh.position);scene.remove(p.mesh);projectiles.splice(i,1);
    }
  }
}

function createExplosion(pos){
  const geo=new THREE.SphereGeometry(10,8,8);
  const mat=new THREE.MeshBasicMaterial({color:0xffaa00,transparent:true,opacity:1});
  const mesh=new THREE.Mesh(geo,mat);mesh.position.copy(pos);scene.add(mesh);
  setTimeout(()=>scene.remove(mesh),200);
}

function playerDie(){
  isDead=true;deaths++;respawnTime=5;
  playerEntity.mesh.visible=false;
  document.getElementById('respawn-screen').style.display='flex';
  bombPathLine.visible=false;
}

function respawnPlayer(){
  isDead=false;document.getElementById('respawn-screen').style.display='none';
  playerEntity.hp=100;playerEntity.alive=true;
  if(gameMode==='drone'){
    playerEntity.pos.set(-1500,400,0);playerEntity.yaw=0;playerEntity.velocity.set(0,0,0);
    playerEntity.mesh.visible=true;
  }else{
    playerEntity.pos.set(-1500,groundY(-1500,0),0);
    playerEntity.mesh.visible=false;
  }
}

// ===== UI =====
const mctx=document.getElementById('minimap').getContext('2d');
function updateHUD(){
  if(!playerEntity)return;
  const pct=Math.max(0,playerEntity.hp)/playerEntity.maxHp*100;
  document.getElementById('hp-fill').style.width=pct+'%';
  document.getElementById('hp-fill').style.background=pct>50?'#00ff00':pct>25?'#ffaa00':'#ff0000';
  document.getElementById('hp-text').innerText=Math.ceil(Math.max(0,playerEntity.hp))+' / 100 HP';
  
  const v=new THREE.Vector3();
  entities.forEach(e=>{
    if(!e.marker)return;
    if(!e.alive||e===playerEntity){e.marker.style.display='none';return;}
    v.copy(e.pos);v.y+=e.type==='aa'?40:15;v.project(camera);
    if(v.z>1||v.z<-1){e.marker.style.display='none';return;}
    e.marker.style.display='flex';
    e.marker.style.left=((v.x*0.5+0.5)*innerWidth)+'px';
    e.marker.style.top=((-v.y*0.5+0.5)*innerHeight)+'px';
    e.marker.querySelector('.marker-fill').style.width=(e.hp/e.maxHp*100)+'%';
  });
  
  mctx.clearRect(0,0,220,220);
  mctx.fillStyle='rgba(0,0,0,0.5)';mctx.beginPath();mctx.arc(110,110,110,0,7);mctx.fill();
  const scale=200/SIZE;
  entities.forEach(e=>{
    if(!e.alive)return;
    const mx=110+e.pos.x*scale,my=110+e.pos.z*scale;
    mctx.fillStyle=e.team===TEAM_BLUE?'#00aaff':'#ff0000';
    mctx.beginPath();
    if(e.type==='aa')mctx.rect(mx-3,my-3,6,6);
    else mctx.arc(mx,my,4,0,7);
    mctx.fill();
    if(e===playerEntity){mctx.strokeStyle='#fff';mctx.lineWidth=2;mctx.stroke();}
  });
}

function spawnDmgText(txt,x,y){
  const el=document.createElement('div');el.className='dmg';el.innerText=txt;
  el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);
  setTimeout(()=>el.remove(),1000);
}

// ===== Start =====
init();
</script>
